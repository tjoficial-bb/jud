    <script>
      (function() {
        var isConnError = function(str) {
          if (!str || typeof str !== 'string') return false;
          return str.indexOf('Erro de conexão') !== -1 ||
                 str.indexOf('Failed to fetch') !== -1 ||
                 str.indexOf('NetworkError') !== -1 ||
                 str.indexOf('Load failed') !== -1 ||
                 str.indexOf('temporariamente indisponível') !== -1;
        };

        var origConsoleError = console.error;
        console.error = function() {
          var combined = '';
          for (var i = 0; i < arguments.length; i++) {
            var a = arguments[i];
            combined += ' ' + (typeof a === 'string' ? a : (a && a.message ? a.message : ''));
          }
          if (isConnError(combined)) {
            console.warn('[Network Resilience Handled]:', combined.trim());
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason;
          var msg = (reason && reason.message) || String(reason || '');
          if (isConnError(msg)) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('error', function(e) {
          var msg = (e && e.message) || (e && e.error && e.error.message) || '';
          if (isConnError(msg)) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
